<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>吉野村現烤蛋糕 — 月餅預訂</title>
<link rel="icon" href="icon-192.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
  background: #faf6f0; color: #3d2b1f; line-height: 1.6; padding-bottom: 40px;
}
.header {
  background: linear-gradient(135deg, #8B4513, #D2691E);
  color: #fff; padding: 22px 20px; text-align: center;
}
.header h1 { font-size: 20px; letter-spacing: 1px; }
.header .subtitle { font-size: 13px; opacity: 0.9; margin-top: 4px; }
.container { max-width: 640px; margin: 0 auto; padding: 16px; }
.card {
  background: #fff; border-radius: 12px; padding: 18px;
  box-shadow: 0 2px 8px rgba(139,69,19,0.08); margin-bottom: 16px;
}
.card h2 {
  font-size: 15px; color: #8B4513; margin-bottom: 14px;
  padding-bottom: 8px; border-bottom: 2px solid #f0e4d4;
}
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #6d4c35; }
label .req { color: #c62828; }
input, select, textarea {
  width: 100%; padding: 11px 12px; border: 1px solid #ddd0c0; border-radius: 8px;
  font-size: 16px; font-family: inherit; background: #fff; color: #3d2b1f;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: #D2691E; }
textarea { resize: vertical; min-height: 70px; }
.field { margin-bottom: 14px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.hint { font-size: 12px; color: #8a7563; margin-top: 4px; }

.item-card {
  border: 1px solid #e8d9c5; border-radius: 10px; padding: 14px;
  margin-bottom: 12px; background: #fffdfa; position: relative;
}
.item-card-head {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
}
.item-no { font-size: 13px; font-weight: 700; color: #8B4513; }
.btn-x {
  background: none; border: none; color: #c62828; font-size: 20px;
  cursor: pointer; padding: 0 6px; line-height: 1;
}
.item-sub {
  text-align: right; font-size: 14px; font-weight: 700;
  color: #8B4513; margin-top: 10px;
}
.fill-head {
  font-size: 13px; font-weight: 600; color: #6d4c35;
  margin: 12px 0 6px; display: flex; justify-content: space-between; align-items: baseline;
}
.fill-row { display: flex; gap: 6px; align-items: center; margin-bottom: 7px; }
.fill-row select { flex: 1; min-width: 0; padding: 9px 8px; font-size: 15px; }
.fill-row input { width: 68px; flex: none; padding: 9px 6px; font-size: 15px; text-align: center; }
.fill-row .u { font-size: 13px; color: #8a7563; flex: none; }
.fill-row .rm {
  flex: none; background: none; border: none; color: #c62828;
  font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1;
}
.btn-fill {
  background: none; border: 1px dashed #c9b49a; border-radius: 6px;
  color: #8B4513; font-size: 13px; padding: 7px 12px; cursor: pointer;
  font-family: inherit; width: 100%;
}
.balance { font-size: 12px; font-weight: 600; margin-top: 6px; }
.balance.ok { color: #2e7d32; }
.balance.bad { color: #c62828; }
.btn {
  padding: 12px 18px; border: none; border-radius: 8px; font-size: 15px;
  font-weight: 600; cursor: pointer; font-family: inherit;
}
.btn-add {
  width: 100%; background: #fff; color: #8B4513;
  border: 2px dashed #D2691E; margin-bottom: 8px;
}
.btn-primary {
  width: 100%; background: linear-gradient(135deg, #8B4513, #D2691E);
  color: #fff; font-size: 17px; padding: 15px;
}
.btn-primary:disabled { opacity: 0.55; }
.total-bar {
  background: #fff5e9; border: 1px solid #f0d9bd; border-radius: 10px;
  padding: 14px 16px; display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 16px;
}
.total-bar .label { font-size: 14px; color: #6d4c35; }
.total-bar .amount { font-size: 24px; font-weight: 800; color: #8B4513; }
.total-bar .pieces { font-size: 12px; color: #8a7563; }
.note-box {
  background: #fff8ec; border-left: 4px solid #D2691E;
  padding: 12px 14px; border-radius: 6px; font-size: 13px; color: #6d4c35;
  margin-bottom: 16px;
}
.done {
  text-align: center; padding: 40px 20px;
}
.done .tick { font-size: 56px; }
.done h2 { font-size: 20px; color: #8B4513; margin: 12px 0 8px; border: none; }
.done p { font-size: 14px; color: #6d4c35; }
.done .order-box {
  background: #fff5e9; border-radius: 10px; padding: 16px;
  margin: 18px 0; text-align: left; font-size: 14px;
}
.err {
  background: #ffebee; color: #c62828; padding: 12px 14px;
  border-radius: 8px; font-size: 14px; margin-bottom: 14px;
  white-space: pre-line;   /* 讓多行錯誤訊息換行 */
}
.loading { text-align: center; padding: 40px; color: #8a7563; }
</style>
</head>
<body>

<div class="header">
  <h1>吉野村現烤蛋糕</h1>
  <div class="subtitle">中秋月餅預訂單</div>
</div>

<div class="container">
  <div id="loading" class="loading">載入中…</div>

  <div id="form" style="display:none">
    <div class="note-box">
      填好送出後，我們會與您聯繫確認訂單與金額。<br>
      金額為系統試算，實際以店家確認為準。
    </div>

    <div id="errBox"></div>

    <div class="card">
      <h2>訂購人資料</h2>
      <div class="field">
        <label>姓名 <span class="req">*</span></label>
        <input type="text" id="customer" placeholder="請輸入姓名" maxlength="40">
      </div>
      <div class="field">
        <label>聯絡電話 <span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="09xxxxxxxx" maxlength="25">
      </div>
      <div class="row">
        <div class="field">
          <label>取貨日期 <span class="req">*</span></label>
          <input type="date" id="pickupDate">
        </div>
        <div class="field">
          <label>取貨時間</label>
          <input type="time" id="pickupTime" step="300" min="07:00" max="18:00">
          <div class="hint">營業時間 07:00–18:00</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>訂購內容</h2>
      <p style="font-size:13px;color:#8a7563;margin-bottom:12px">
        <b>禮盒</b>可選 6～15 入，<b>塑膠盒</b>固定 6 入，<b>散裝</b>沒有盒子、要幾顆就填幾顆。<br>
        一盒可以混搭不同口味 —— 例如 10 入禮盒要蛋黃酥 4 顆、綠豆椪 6 顆，
        就按「再加一種口味」分開填，顆數加起來等於盒子入數就可以了。
      </p>
      <div id="items"></div>
      <button class="btn btn-add" onclick="addItem()">＋ 再加一項</button>
    </div>

    <div class="total-bar">
      <div>
        <div class="label">預估金額</div>
        <div class="pieces" id="pieces">共 0 顆</div>
      </div>
      <div class="amount" id="total">$0</div>
    </div>

    <div class="card">
      <h2>備註</h2>
      <textarea id="note" placeholder="有其他需求請寫在這裡，例如指定口味比例、送禮包裝等" maxlength="500"></textarea>
    </div>

    <button class="btn btn-primary" id="submitBtn" onclick="submitOrder()">送出預訂單</button>
  </div>

  <div id="done" style="display:none"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDBpASdM7q4vI7miLtplgDtWMPbkzHhKnw",
  authDomain: "yoshino-mooncake.firebaseapp.com",
  projectId: "yoshino-mooncake",
  storageBucket: "yoshino-mooncake.firebasestorage.app",
  messagingSenderId: "1071837132002",
  appId: "1:1071837132002:web:4514cddb8852ef2c95dabb"
};

// 跟店家系統同一套預設值，讀不到雲端設定時才會用到
const DEFAULT_PRICING = { unitPrice: 55, giftSix: 30, giftOther: 50, plastic: 0 };
const DEFAULT_PRODUCTS = [
  { name: '蛋黃酥' }, { name: '鹹蛋黃酥' }, { name: '綠豆椪' },
  { name: '芋頭酥' }, { name: '金月亮' },
];
const GIFT_UNITS = [6, 9, 10, 12, 15];
const PLASTIC_UNITS = [6];        // 塑膠盒固定 6 入
const PACKS = ['禮盒', '塑膠盒', '散裝'];

// 營業時段：早上 7 點到下午 6 點。時間可以自由填，但超出範圍不給送出。
const PICKUP_START = '07:00';
const PICKUP_END = '18:00';

// 沒填代表還沒決定，允許；有填就必須落在營業時間內。
// HH:MM 都是零開頭的固定格式，直接字串比較就是正確的時間順序。
function pickupTimeOutOfRange(t) {
  if (!t) return false;
  return t < PICKUP_START || t > PICKUP_END;
}

let db = null;
let products = DEFAULT_PRODUCTS;
let pricing = DEFAULT_PRICING;

firebase.initializeApp(firebaseConfig);
db = firebase.firestore();

// 先把店家設定的口味和價格讀進來，讀不到就用預設值，不擋客人下單
db.collection('settings').doc('products').get()
  .then(doc => {
    if (doc.exists) {
      const d = doc.data();
      if (d.list && d.list.length) products = d.list;
      if (d.pricing) {
        pricing = Object.assign({}, DEFAULT_PRICING, d.pricing);
        // 舊設定把塑膠盒加價存在 loose 欄位
        if (d.pricing.plastic == null && d.pricing.loose != null) pricing.plastic = Number(d.pricing.loose) || 0;
      }
    }
  })
  .catch(() => {})
  .then(() => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('form').style.display = '';
    addItem();
  });

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function money(n) { return '$' + (Number(n) || 0).toLocaleString(); }

// 盒子加價：禮盒 6 入一種價、其他入數另一種價；塑膠盒自訂（預設 0）；散裝沒有盒子
function boxFee(pack, units) {
  if (pack === '散裝') return 0;
  if (pack === '塑膠盒') return Number(pricing.plastic) || 0;
  return Number(units) === 6
    ? (Number(pricing.giftSix) || 0)
    : (Number(pricing.giftOther) || 0);
}

// 散裝沒有「幾入」，顆數就是各口味加總
function isLoose(pack) { return pack === '散裝'; }

// 一盒多少錢＝盒內各口味（顆數 × 該口味單價）相加，再加盒子加價
// 跟店家系統同一套算法，混搭禮盒也照這個算
function calcBoxPrice(pack, units, fillings) {
  const def = Number(pricing.unitPrice) || 0;
  let sum = 0;
  (fillings || []).forEach(f => {
    const prod = products.find(p => p.name === f.name);
    const up = (prod && Number(prod.price) > 0) ? Number(prod.price) : def;
    sum += up * (Number(f.per) || 0);
  });
  return sum + boxFee(pack, units);
}

let itemSeq = 0;

function addItem() {
  itemSeq++;
  const div = document.createElement('div');
  div.className = 'item-card';
  div.innerHTML =
    '<div class="item-card-head">' +
      '<span class="item-no"></span>' +
      '<button class="btn-x" onclick="removeItem(this)" title="刪除">×</button>' +
    '</div>' +
    '<div class="row">' +
      '<div class="field">' +
        '<label>包裝</label>' +
        '<select class="pack" onchange="onPackChange(this)">' +
          PACKS.map(p => '<option value="' + p + '">' + p + '</option>').join('') +
        '</select>' +
      '</div>' +
      '<div class="field f-units">' +
        '<label>幾入</label>' +
        '<select class="units" onchange="onUnitsChange(this)"></select>' +
      '</div>' +
      '<div class="field f-boxes">' +
        '<label>幾盒</label>' +
        '<input type="number" class="boxes" value="1" min="1" max="999" oninput="recalc()">' +
      '</div>' +
    '</div>' +
    '<div class="fill-head">' +
      '<span class="fill-title">一盒裡面要放什麼口味</span>' +
      '<span class="balance"></span>' +
    '</div>' +
    '<div class="fill-list"></div>' +
    '<button class="btn-fill" onclick="addFill(this.closest(\'.item-card\'))">＋ 這盒再加一種口味</button>' +
    '<div class="item-sub"></div>';
  document.getElementById('items').appendChild(div);
  fillUnits(div);
  applyPackLayout(div);
  addFill(div);          // 預設先給一列，只要一種口味的人不用多按
  syncSingleFilling(div);
  renumber();
  recalc();
}

// 散裝沒有盒子，把「幾入 / 幾盒」收起來，顆數直接由口味加總
function applyPackLayout(div) {
  const loose = isLoose(div.querySelector('.pack').value);
  div.querySelector('.f-units').style.display = loose ? 'none' : '';
  div.querySelector('.f-boxes').style.display = loose ? 'none' : '';
  div.querySelector('.fill-title').textContent =
    loose ? '要哪些口味、各幾顆' : '一盒裡面要放什麼口味';
  if (loose) div.querySelector('.boxes').value = 1;
}

// 這盒新增一列口味
function addFill(div) {
  const list = div.querySelector('.fill-list');
  const row = document.createElement('div');
  row.className = 'fill-row';
  row.innerHTML =
    '<select class="f-name" onchange="recalc()">' +
      products.map(p => '<option value="' + esc(p.name) + '">' + esc(p.name) + '</option>').join('') +
    '</select>' +
    '<input type="number" class="f-per" min="0" max="999" placeholder="顆" oninput="recalc()">' +
    '<span class="u">顆</span>' +
    '<button class="rm" onclick="removeFill(this)" title="刪除">×</button>';
  list.appendChild(row);
  recalc();
}

function removeFill(btn) {
  const div = btn.closest('.item-card');
  const list = div.querySelector('.fill-list');
  if (list.children.length <= 1) { alert('一盒至少要有一種口味'); return; }
  btn.closest('.fill-row').remove();
  recalc();
}

// 只有一種口味時，顆數自動等於盒子入數，客人不用自己算
function syncSingleFilling(div) {
  if (isLoose(div.querySelector('.pack').value)) return;   // 散裝顆數由客人自己填
  const rows = div.querySelectorAll('.fill-row');
  if (rows.length !== 1) return;
  const units = parseInt(div.querySelector('.units').value) || 0;
  rows[0].querySelector('.f-per').value = units || '';
}

function onUnitsChange(sel) {
  syncSingleFilling(sel.closest('.item-card'));
  recalc();
}

function removeItem(btn) {
  const items = document.getElementById('items');
  if (items.children.length <= 1) { alert('至少要有一項'); return; }
  btn.closest('.item-card').remove();
  renumber();
  recalc();
}

function renumber() {
  document.querySelectorAll('#items .item-card').forEach((d, i) => {
    d.querySelector('.item-no').textContent = '第 ' + (i + 1) + ' 項';
    d.querySelector('.btn-x').style.visibility =
      document.querySelectorAll('#items .item-card').length > 1 ? '' : 'hidden';
  });
}

function onPackChange(sel) {
  const div = sel.closest('.item-card');
  fillUnits(div);
  applyPackLayout(div);
  syncSingleFilling(div);
  recalc();
}

function fillUnits(div) {
  const pack = div.querySelector('.pack').value;
  const list = pack === '塑膠盒' ? PLASTIC_UNITS : GIFT_UNITS;
  const sel = div.querySelector('.units');
  const prev = sel.value;
  sel.innerHTML = list.map(u => '<option value="' + u + '">' + u + ' 入</option>').join('');
  if (list.indexOf(Number(prev)) !== -1) sel.value = prev;
}

// 讀出一張品項卡，格式跟店家系統的品項完全一致，接受後可直接沿用
function readItem(div) {
  const pack = div.querySelector('.pack').value;

  const fillings = [];
  div.querySelectorAll('.fill-row').forEach(row => {
    const name = row.querySelector('.f-name').value;
    const per = parseInt(row.querySelector('.f-per').value) || 0;
    if (name && per > 0) fillings.push({ name: name, per: per });
  });
  const filled = fillings.reduce((s, f) => s + f.per, 0);

  // 散裝沒有盒子：顆數就是各口味加總，盒數固定 1
  const loose = isLoose(pack);
  const unitsPerBox = loose ? filled : (parseInt(div.querySelector('.units').value) || 0);
  const boxes = loose ? 1 : (parseInt(div.querySelector('.boxes').value) || 0);
  const boxPrice = calcBoxPrice(pack, unitsPerBox, fillings);

  return {
    pack: pack, unitsPerBox: unitsPerBox, boxes: boxes, boxPrice: boxPrice,
    fillings: fillings, filled: filled,
    qty: unitsPerBox * boxes,
    subtotal: boxPrice * boxes,
    name: fillings.length === 1 ? fillings[0].name : (fillings.length ? '綜合' : '')
  };
}

function readAllItems() {
  return Array.from(document.querySelectorAll('#items .item-card'))
    .map(readItem)
    .filter(i => i.boxes > 0 && i.unitsPerBox > 0 && i.fillings.length);
}

function itemContentsText(i) {
  return (i.fillings || []).map(f => f.name + ' ' + f.per).join('、');
}

// 顆數沒湊滿的品項，回傳提示文字
function unbalanced() {
  const bad = [];
  document.querySelectorAll('#items .item-card').forEach((div, idx) => {
    const i = readItem(div);
    if (isLoose(i.pack)) return;   // 散裝的顆數就是加總，不會對不起來
    if (i.fillings.length && i.unitsPerBox && i.filled !== i.unitsPerBox) {
      bad.push('第 ' + (idx + 1) + ' 項：' + i.unitsPerBox + ' 入的盒子，口味卻只配了 ' + i.filled + ' 顆');
    }
  });
  return bad;
}

function recalc() {
  let total = 0, pieces = 0;
  document.querySelectorAll('#items .item-card').forEach(div => {
    const i = readItem(div);
    total += i.subtotal;
    pieces += i.qty;

    const bal = div.querySelector('.balance');
    const diff = i.unitsPerBox - i.filled;
    if (isLoose(i.pack)) {
      bal.textContent = i.filled ? ('共 ' + i.filled + ' 顆') : '';
      bal.className = 'balance ok';
    } else if (!i.unitsPerBox || !i.fillings.length) {
      bal.textContent = ''; bal.className = 'balance';
    } else if (diff === 0) {
      bal.textContent = '✓ 剛好 ' + i.unitsPerBox + ' 顆'; bal.className = 'balance ok';
    } else if (diff > 0) {
      bal.textContent = '還差 ' + diff + ' 顆'; bal.className = 'balance bad';
    } else {
      bal.textContent = '多了 ' + (-diff) + ' 顆'; bal.className = 'balance bad';
    }

    div.querySelector('.item-sub').textContent = isLoose(i.pack)
      ? (i.filled + ' 顆 ＝ ' + money(i.subtotal))
      : ('每盒 ' + money(i.boxPrice) + ' × ' + i.boxes + ' 盒 ＝ ' + money(i.subtotal));
  });
  document.getElementById('total').textContent = money(total);
  document.getElementById('pieces').textContent = '共 ' + pieces + ' 顆';
}

function showError(msg) {
  document.getElementById('errBox').innerHTML = msg ? '<div class="err">' + esc(msg) + '</div>' : '';
  if (msg) window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function submitOrder() {
  const customer = document.getElementById('customer').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const pickupDate = document.getElementById('pickupDate').value;
  const pickupTime = document.getElementById('pickupTime').value;
  const note = document.getElementById('note').value.trim();
  const items = readAllItems();

  if (!customer) { showError('請填寫姓名'); return; }
  if (!phone) { showError('請填寫聯絡電話'); return; }
  if (!pickupDate) { showError('請選擇取貨日期'); return; }
  if (pickupTimeOutOfRange(pickupTime)) {
    showError('取貨時間 ' + pickupTime + ' 不在營業時間內，請改成 ' + PICKUP_START + ' 到 ' + PICKUP_END + ' 之間。');
    return;
  }
  if (!items.length) { showError('請至少訂購一項，並選好口味和盒數'); return; }
  const bad = unbalanced();
  if (bad.length) { showError('口味顆數要跟盒子的入數一樣：\n' + bad.join('\n')); return; }
  showError('');

  const total = items.reduce((s, i) => s + i.subtotal, 0);
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '送出中…';

  const data = {
    customer: customer, phone: phone,
    pickupDate: pickupDate, pickupTime: pickupTime || '',
    note: note, items: items, total: total,
    status: 'new', source: 'customer',
    createdAt: new Date().toISOString()
  };

  try {
    await db.collection('submissions').add(data);
    showDone(data);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '送出預訂單';
    const code = String((e && (e.code || e.message)) || e);
    showError('送出失敗：' + code + '　請稍後再試，或直接與店家聯繫。');
  }
}

function showDone(d) {
  document.getElementById('form').style.display = 'none';
  const lines = d.items.map(i => {
    const spec = i.pack === '散裝'
      ? ('散裝 ' + i.unitsPerBox + ' 顆')
      : (esc(i.pack) + i.unitsPerBox + '入 × ' + i.boxes + ' 盒');
    const detail = i.fillings && i.fillings.length > 1
      ? '<br><span style="color:#8a7563;font-size:13px">　（' + esc(itemContentsText(i)) + '）</span>'
      : '';
    return esc(i.name) + '　' + spec + '　' + money(i.subtotal) + detail;
  }).join('<br>');
  document.getElementById('done').style.display = '';
  document.getElementById('done').innerHTML =
    '<div class="card done">' +
      '<div class="tick">✅</div>' +
      '<h2>預訂單已送出</h2>' +
      '<p>我們會盡快與您聯繫確認，謝謝！</p>' +
      '<div class="order-box">' +
        '<b>' + esc(d.customer) + '</b>　' + esc(d.phone) + '<br>' +
        '取貨：' + esc(d.pickupDate) + (d.pickupTime ? ' ' + esc(d.pickupTime) : '') + '<br><br>' +
        lines + '<br><br>' +
        '<b>預估金額：' + money(d.total) + '</b>' +
      '</div>' +
      '<p style="font-size:13px;color:#8a7563">實際金額以店家確認為準</p>' +
    '</div>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
